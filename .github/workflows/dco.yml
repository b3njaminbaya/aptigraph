name: DCO

on:
  pull_request:

jobs:
  check-signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every commit has a Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          missing=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -q "^Signed-off-by: "; then
              echo "::error::Commit $sha is missing a 'Signed-off-by' trailer (DCO)."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Every commit must be signed off per the Developer Certificate of Origin (https://developercertificate.org/)."
            echo "Fix it with: git commit --amend -s --no-edit   (then: git push --force-with-lease)"
            echo "Or sign off future commits with: git commit -s"
            exit 1
          fi
