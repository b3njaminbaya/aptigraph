name: Feature request
description: Suggest an idea for Aptigraph
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What's missing or annoying today? (Not the feature itself yet — the underlying need.)
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your proposed solution, as concretely as you can describe it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways to solve the same problem?
    validations:
      required: false
